{% extends "base.html" %}
{% block content %}
  <div class="d-flex justify-content-center">
    <div class="card p-3" style="width:480px;">
      <h3 class="mb-3">Create account</h3>
      <form method="post">{% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Sign up</button>
      </form>
      <div class="mt-2 text-center"><a href="{% url 'accounts:login' %}">Already have an account? Login</a></div>
    </div>
  </div>
{% endblock %}
