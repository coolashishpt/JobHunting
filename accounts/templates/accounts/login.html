{% extends "base.html" %}
{% block content %}
  <div class="d-flex justify-content-center">
    <div class="card p-3" style="width:360px;">
      <h3 class="mb-3">Login</h3>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="post">{% csrf_token %}
        <div class="mb-3"><label>Username</label><input name="username" class="form-control"></div>
        <div class="mb-3"><label>Password</label><input type="password" name="password" class="form-control"></div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <div class="mt-2 text-center"><a href="{% url 'accounts:signup' %}">Create account</a> • <a href="{% url 'password_reset' %}">Forgot password?</a></div>
    </div>
  </div>
{% endblock %}
